name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Vacías en producción (dominio propio). Para publicar temporalmente en
      # https://juankcasal.github.io/solvers-web/ definir en Settings → Secrets and variables → Actions → Variables:
      #   SITE_URL = https://juankcasal.github.io   y   BASE_PATH = /solvers-web
      SITE_URL: ${{ vars.SITE_URL }}
      BASE_PATH: ${{ vars.BASE_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Instalar, compilar y subir el sitio
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
